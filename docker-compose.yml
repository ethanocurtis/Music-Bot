services:
  bot:
    build: .
    container_name: all-in-one-music-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      lavalink:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.1.2-alpine
    container_name: music-lavalink
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: "-Xms256M -Xmx1G"
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-change-me}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
    expose:
      - "2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Authorization: ${LAVALINK_PASSWORD:-change-me}' -O - http://localhost:2333/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
